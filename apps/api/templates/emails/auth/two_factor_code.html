{% extends "emails/auth/two_factor_base.html" %}
{% comment %}Two-factor code (setup and sign-in). No links: the code is typed into the page already open.{% endcomment %}

{% block main %}
                  <!-- Code chip -->
                  <p style="margin: 20px 0 8px;">
                    <span
                      style="
                        display: inline-block;
                        padding: 10px 18px;
                        background-color: #e4e5e7;
                        border-radius: 6px;
                        font-family: 'SF Mono', Menlo, Monaco, Consolas,
                          'Liberation Mono', 'Courier New', monospace;
                        font-size: 24px;
                        letter-spacing: 0.2em;
                        color: #111111;
                      "
                    >
                      {{ code_display }}
                    </span>
                  </p>

                  <p
                    style="
                      margin: 0;
                      font-size: 13px;
                      line-height: 1.6;
                      color: #5f5e5e;
                    "
                  >
                    Expires in {{ expires_minutes }} minutes &middot; single use
                  </p>
{% endblock %}
