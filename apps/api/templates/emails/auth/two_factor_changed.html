{% extends "emails/auth/two_factor_base.html" %}
{% comment %}Notice that two-factor authentication was turned on or off, with a way back if it wasn't the user.{% endcomment %}

{% block action %}
                  <!-- Reset password -->
                  {% if action_text %}
                  <p style="margin: 24px 0 0; font-size: 13px; line-height: 1.6; color: #5f5e5e;">
                    {{ action_text }}
                  </p>
                  {% endif %}
                  <p style="margin: 16px 0 0;">
                    <a
                      href="{{ reset_url }}"
                      style="
                        display: inline-block;
                        padding: 10px 18px;
                        background-color: #000000;
                        border-radius: 6px;
                        font-size: 14px;
                        font-weight: 600;
                        color: #ffffff;
                        text-decoration: none;
                      "
                      >Reset password</a
                    >
                  </p>
{% endblock %}
